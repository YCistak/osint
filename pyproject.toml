[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-tui"
version = "0.1.0"
description = "Kişisel dijital iz denetimi ve CTF öğrenimi için terminal arayüzlü OSINT aracı"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "dnspython>=2.4",
    "python-whois>=0.9",
    "holehe>=1.61",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
osint-tui = "osint_tui.app:main"

[tool.setuptools]
packages = ["osint_tui"]

[tool.setuptools.package-data]
osint_tui = ["siteler.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not canli'"
markers = ["canli: gerçek ağ erişimi gerektiren duman (smoke) testleri"]
